<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
  <meta http-equiv="refresh" content="1800;url=index.html">
  <title>TE-NTF&FPY</title>
  <link rel="stylesheet" href="../layui/css/layui.css" media="all">
  <script src="../layui/layui.js"></script>
  <script src="/js/i18n.js"></script>
  <script>
layui.use(['form', 'laydate'], function () {
  var laydate = layui.laydate;
  var form = layui.form;

  laydate.render({ elem: '#StartTime' });
  laydate.render({ elem: '#EndTime' });
  form.render();
});

function Serach() {
  var st = StartTime.value;
  var et = EndTime.value;
  var tm = document.getElementById("team").value;
  var str = tm + "_" + st + "_" + et;

  if (window.XMLHttpRequest) {
    xmlhttp = new XMLHttpRequest();
  }
  else {
    xmlhttp = new ActiveXObject("Microsoft.XMLHTTP");
  }
  xmlhttp.onreadystatechange = function () {
    if (xmlhttp.readyState == 4 && xmlhttp.status == 200) {
      document.getElementById("txtHint").innerHTML = xmlhttp.responseText;
    }
  }
  xmlhttp.open("POST", "fpy/fpy_v1.php?q=" + str, true);
  xmlhttp.send();
}

function Creat() {
  window.location.href = "fpy/chart_fpy.php";
}

function out() {
  var x = document.getElementById("team");
  if (x.selectedIndex == 1) {
    window.location.href = "fpy/exportaoi.php";
  }
  if (x.selectedIndex == 2) {
    window.location.href = "fpy/export.php";
  }
  if (x.selectedIndex == 3) {
    window.location.href = "fpy/exportft.php";
  }
}
  </script>
</head>
<body class="layui-bg-gray">

<div class="layui-fluid" style="padding-top:15px;padding-bottom:15px">
  <div class="layui-card">
    <div class="layui-card-header">TE-NTF &amp; FPY 良率查詢</div>
    <div class="layui-card-body">
      <div class="layui-form">
        <div class="layui-form-item">
          <div class="layui-inline">
            <label class="layui-form-label" style="width:60px">部门</label>
            <div class="layui-input-inline" style="width:110px">
              <select id="team" name="TEAMS" lay-verify="">
                <option value="">部门:</option>
                <option value="AOI">AOI</option>
                <option value="ATE">ATE</option>
                <option value="FT">FT</option>
              </select>
            </div>
          </div>
          <div class="layui-inline">
            <label class="layui-form-label" style="width:60px">日期</label>
            <div class="layui-input-inline" style="width:150px">
              <input id="StartTime" type="text" class="layui-input" placeholder="开始日期" autocomplete="off">
            </div>
            <div class="layui-input-inline" style="width:150px">
              <input id="EndTime" type="text" class="layui-input" placeholder="结束日期" autocomplete="off">
            </div>
          </div>
          <div class="layui-inline">
            <button id="btn-search" type="button" class="layui-btn layui-btn-sm" onclick="Serach()">查询</button>
            <button id="btn-create" type="button" class="layui-btn layui-btn-sm layui-btn-normal" onclick="Creat()">图表</button>
            <button id="btn-output" type="button" class="layui-btn layui-btn-sm layui-btn-warm" onclick="out()">导出数据</button>
            <button id="btn-back" type="button" class="layui-btn layui-btn-sm layui-btn-primary" onclick="back()">退出</button>
          </div>
        </div>
      </div>
      <div id="txtHint" class="layui-text" style="min-height:600px">请选择部门日期...</div>
    </div>
  </div>
</div>

<script>
function back() {
  window.location.href = "/";
}
</script>
</body>
</html>
