<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
  <meta http-equiv="refresh" content="1800;url=index.html">
  <title>ATE资料查找</title>
  <link rel="stylesheet" href="../layui/css/layui.css" media="all">
  <script src="../layui/layui.js"></script>
  <script src="/js/i18n.js"></script>
  <script>
layui.use(['form', 'laydate'], function () {
  var laydate = layui.laydate;
  var form = layui.form;

  laydate.render({ elem: '#StartTime' });
  form.render();
});

function Serach() {
  var st = StartTime.value;
  var ln = document.getElementById("line").value;
  var tm = document.getElementById("team").value;
  var strsn = sn.value;
  var str = tm + "," + ln + "," + st + "," + strsn;

  if (window.XMLHttpRequest) {
    xmlhttp = new XMLHttpRequest();
  }
  else {
    xmlhttp = new ActiveXObject("Microsoft.XMLHTTP");
  }
  xmlhttp.onreadystatechange = function () {
    if (xmlhttp.readyState == 4 && xmlhttp.status == 200) {
      document.getElementById("txtHint").innerHTML = xmlhttp.responseText;
    }
  }
  xmlhttp.open("POST", "read.php?q=" + str, true);
  xmlhttp.send();
}

function back() {
  window.location.href = "/";
}
  </script>
</head>
<body class="layui-bg-gray">

<div class="layui-fluid" style="padding-top:15px;padding-bottom:15px">
  <div class="layui-card">
    <div class="layui-card-header">ATE资料查找</div>
    <div class="layui-card-body">
      <div class="layui-form">
        <div class="layui-form-item">
          <div class="layui-inline">
            <label class="layui-form-label" style="width:60px">部门</label>
            <div class="layui-input-inline" style="width:110px">
              <select id="team" name="TEAMS">
                <option value="ATE">部门:</option>
                <option value="ATE">ATE</option>
              </select>
            </div>
          </div>
          <div class="layui-inline">
            <label class="layui-form-label" style="width:60px">线别</label>
            <div class="layui-input-inline" style="width:110px">
              <select id="line" name="LINES">
                <option value="ALL">线别:</option>
                <option value="A">A</option>
                <option value="B">B</option>
                <option value="C">C</option>
                <option value="D">D</option>
                <option value="E">E</option>
                <option value="F">F</option>
                <option value="G">G</option>
                <option value="H">H</option>
                <option value="I">I</option>
                <option value="ALL">ALL</option>
              </select>
            </div>
          </div>
          <div class="layui-inline">
            <label class="layui-form-label" style="width:60px">日期</label>
            <div class="layui-input-inline" style="width:150px">
              <input id="StartTime" type="text" class="layui-input" placeholder="请选择日期" autocomplete="off">
            </div>
          </div>
          <div class="layui-inline">
            <label class="layui-form-label" style="width:50px">SN</label>
            <div class="layui-input-inline" style="width:200px">
              <input id="sn" type="text" class="layui-input" placeholder="请输入条码" autocomplete="off">
            </div>
          </div>
          <div class="layui-inline">
            <button id="btn-search" type="button" class="layui-btn layui-btn-sm" onclick="Serach()">查询记录</button>
            <button id="btn-back" type="button" class="layui-btn layui-btn-sm layui-btn-primary" onclick="back()">退出</button>
          </div>
        </div>
      </div>
      <div id="txtHint" class="layui-text" style="min-height:600px">请输入条码...</div>
    </div>
  </div>
</div>

</body>
</html>
