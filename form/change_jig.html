<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>交接记录</title>
  <meta name="renderer" content="webkit">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="apple-mobile-web-app-status-bar-style" content="black"> 
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="format-detection" content="telephone=no">
  <link rel="stylesheet" href="../layui/css/layui.css" media="all">
  <script src="../js/jquery-1.7.2.js"></script>
</head>
<body class="layui-bg-gray">
<div class="layui-fluid" style="padding-top:15px;padding-bottom:15px">
<div class="layui-card">
  <div class="layui-card-header">INLINE ATE治具點檢記錄</div>
  <div class="layui-card-body">
<form class="layui-form layui-form-pane1" action="" lay-filter="first">

   
    <div class="layui-inline">
    <label class="layui-form-label">探針使用次數</label>
    <div class="layui-input-block">
	<input type="text" name="probe" id="probe"   lay-verify="required"   autocomplete="off" class="layui-input">
    </div>
  </div>
 <br><br> 
 
 
      <div class="layui-inline">
    <label class="layui-form-label">機臺</label>
    <div class="layui-input-block">
	<input type="text" name="device" id="device"   lay-verify="required"   autocomplete="off" class="layui-input">
    </div>
  </div>
 <br><br> 
 
 
     <div class="layui-inline">
    <label class="layui-form-label">時間</label>
    <div class="layui-input-block">
	<input type="text" name="time" id="time"   lay-verify="required"   autocomplete="off" class="layui-input">
    </div>
  </div>
 <br><br> 
 
 
  <div class="layui-inline" pane>
    <label class="layui-form-label">點檢項</label>
    <div class="layui-input-block">
      <input type="checkbox" name="like[write]" title="治具結構">
	  <br><br>
      <input type="checkbox" name="like[read]" title="載板清潔">
	  <br><br>
      <input type="checkbox" name="like[game]" title="有板信號" >
	  
    </div>
  </div> 
 <br><br>  
 
 
 
 
 
      <div class="layui-inline">
    <label class="layui-form-label">檢查者</label>
    <div class="layui-input-block">
	<input type="text" name="owner" id="owner"   lay-verify="required"   autocomplete="off" class="layui-input">
    </div>
  </div>
 <br><br> 
 
   
<div class="layui-inline">
    <label class="layui-form-label">確認者</label>
    <div class="layui-input-block">
      <select name="check" lay-verify="required|line" id="check" autocomplete="off">
	    <option value="">請選擇</option>
        <option value="黄凯">黃凱</option>
        <option value="彭川">彭川</option>
        <option value="杨伟">楊偉</option>
		<option value="王波">王波</option>
        <option value="李梦艺">李夢藝</option>
        <option value="周彪">周彪</option>
		<option value="王满亮">王滿亮</option>	
      </select>	
    </div>
  <label class="layui-form-label">密码</label>
    <div class="layui-input-block">
	<input type="password" name="pass" id="pass"   lay-verify="required|pass"   autocomplete="off" class="layui-input">
    </div>	
	
  </div>
  <br><br>   
  
  <div class="layui-form-item">
    <div class="layui-input-block">
      <button class="layui-btn" lay-submit lay-filter="*">立即提交</button>
      <button type="reset" class="layui-btn layui-btn-primary">重置</button>
    </div>
  </div>
</form>
  </div>
</div>

<br><br><br>


<script src="../layui/layui.js"></script>
<script src="/js/i18n.js"></script>

<script>

 var query = location.search.substring(1);
   var pb = document.getElementById("probe");
   var dv = document.getElementById("device");  
   var tm = document.getElementById("time");
   var ow = document.getElementById("owner"); 
   var ch = document.getElementById("check"); 
 $.post("thing_jig.php?"+query,{},
     function(data){ 
//	 console.log(data);
    var obj = (typeof data === 'string' ? JSON.parse(data) : data); 	
	pb.value=obj.probe;
	dv.value=obj.device;	
	tm.value=obj.time;	
	ow.value=obj.owner;		
    
 for(var i=ch.options.length-1;i>=0;i--)
 {
  if(ch.options[i].value==ow.value)
  {
  ch.options.remove(i);
  }
 }	
	
	
	}
	);

   	

	
	

layui.use(['form','jquery','layer'], function(){
  var form = layui.form;
  var $=layui.jquery;
  var layer=layui.layer;
  
  //自定义验证规则
  form.verify({
   
    time: [/^\d+$/, '时间必须必须是数字']

  });
  
 var thisValue = form.val('first', {
    'like[write]': true
	,'like[read]': true
	,'like[game]': true
  })
  
  
     
  //监听提交
 form.on('submit(*)', function(data){
   var rasult = JSON.stringify(data.field);
     console.log(rasult);
	 $.post("updata_jig.php?"+query,{name:rasult},
     function(data){
     console.log(data);
	 layer.alert("保存成功",function(){ parent.layer.close(parent.w);parent.Update(); });	
    });
	
    return false;
  }); 
});

layui.use('laydate', function(){
  var laydate = layui.laydate; 
  //执行一个laydate实例
  laydate.render({
    elem: '#Adate' //指定元素
	,theme: 'molv'
  });
});

</script>

</div>
</body>
</html>
