<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>交接记录</title>
  <meta name="renderer" content="webkit">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="apple-mobile-web-app-status-bar-style" content="black"> 
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="format-detection" content="telephone=no">
  <link rel="stylesheet" href="../layui/css/layui.css" media="all">
  <script src="../js/jquery-1.7.2.js"></script>
</head>
<body class="layui-bg-gray">
<div class="layui-fluid" style="padding-top:15px;padding-bottom:15px">
<div class="layui-card">
  <div class="layui-card-header">SPI/AOI/ATE/ICT測試程式修改記錄</div>
  <div class="layui-card-body">
<form class="layui-form layui-form-pane1" action="" lay-filter="first">

   
    <div class="layui-inline">
    <label class="layui-form-label">機種</label>
    <div class="layui-input-block">
	<input type="text" name="model" id="model"   lay-verify="required"  placeholder="请输機種名" autocomplete="off" class="layui-input">
    </div>
  </div>
 <br><br> 
   
   
      <div class="layui-inline">
	  <label class="layui-form-label">舊程式名</label>
    <div class="layui-input-block">
	<input type="text" name="oldname" id="oldname"  lay-verify="required"  placeholder="请输程式名" autocomplete="off" class="layui-input">
    </div>
  </div>
 <br><br> 
  
      <div class="layui-inline">
	  <label class="layui-form-label">修改后程式名</label>
    <div class="layui-input-block">
	<input type="text" name="newname" id="newname" lay-verify="required"  placeholder="请输版本" autocomplete="off" class="layui-input">
    </div>
  </div>
 <br><br> 

  

  <div class="layui-form-item layui-form-text">
    <label class="layui-form-label">修改原因</label>
    <div class="layui-input-block">
      <textarea placeholder="请输入内容" class="layui-textarea" name="reason" id="reason" lay-verify="required" autocomplete="off"></textarea>
    </div>
  </div>
  
   <div class="layui-form-item layui-form-text">
    <label class="layui-form-label">修改内容</label>
    <div class="layui-input-block">
      <textarea placeholder="请输入内容" class="layui-textarea" name="summary" id="summary" lay-verify="required" autocomplete="off"></textarea>
    </div>
  </div> 
  
  
 
   
  
  <div class="layui-form-item">
    <div class="layui-input-block">
      <button class="layui-btn" lay-submit lay-filter="*">立即提交</button>
      <button type="reset" class="layui-btn layui-btn-primary">重置</button>
    </div>
  </div>
</form>
  </div>
</div>

<br><br><br>


<script src="../layui/layui.js"></script>
<script src="/js/i18n.js"></script>

<script>


 var query = location.search.substring(1);
   var md = document.getElementById("model");
   var on = document.getElementById("oldname");
   var nn = document.getElementById("newname");
   var rs = document.getElementById("reason");  
   var sm = document.getElementById("summary");  
 $.post("thing.php?"+query,{},
     function(data){ 
	 console.log(data);
    var obj = (typeof data === 'string' ? JSON.parse(data) : data); 	
	md.value=obj.model;
	on.value=obj.oldname;	
	nn.value=obj.newname;	
	rs.value=obj.reason;	
	sm.value=obj.summary;
	
    }
	);

layui.use(['form','jquery','layer'], function(){
  var form = layui.form;
  var $=layui.jquery;
  var layer=layui.layer;
  
  //自定义验证规则
  form.verify({
   
    time: [/^\d+$/, '时间必须必须是数字']

  });
     
  //监听提交
 form.on('submit(*)', function(data){
   var rasult = JSON.stringify(data.field);
   // console.log(rasult.time);
	 $.post("updata.php?"+query,{name:rasult},
     function(data){
     console.log(data);
	 layer.alert("保存成功",function(){ window.close(); });	
    });
    return false;
  }); 
});

layui.use('laydate', function(){
  var laydate = layui.laydate; 
  //执行一个laydate实例
  laydate.render({
    elem: '#Adate' //指定元素
	,theme: 'molv'
  });
});

</script>

</div>
</body>
</html>
