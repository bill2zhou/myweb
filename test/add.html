<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>添加題目</title>
  <meta name="renderer" content="webkit">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="apple-mobile-web-app-status-bar-style" content="black"> 
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="format-detection" content="telephone=no">
  <link rel="stylesheet" href="../layui/css/layui.css" media="all">
<script src="../layui/layui.js"></script>
<script src="/js/i18n.js"></script>
</head>
<body class="layui-bg-gray">
<div class="layui-fluid" style="padding-top:15px;padding-bottom:15px">
<div class="layui-card">
  <div class="layui-card-header">添加題目</div>
  <div class="layui-card-body">
<form class="layui-form layui-form-pane1" action="" lay-filter="first">


<div class="layui-inline">
    <label class="layui-form-label">部门</label>
    <div class="layui-input-block">
      <select name="team" lay-verify="required|line" id="team" autocomplete="off">
        <option value="ATE">ATE</option>
        <option value="AOI">AOI</option>
        <option value="FT">FT</option>
      </select>
    </div>
  </div>
  <br><br> 
<div class="layui-inline">
    <label class="layui-form-label">題目類型</label>
    <div class="layui-input-block">
      <select name="level" lay-verify="required|line" id="team" autocomplete="off">
        <option value="">題目類型</option>
        <option value="Basic">Basic</option>
        <option value="Standard">Standard</option>
        <option value="Advance">Advance</option>
		<option value="Professional">Professional</option>
      </select>
    </div>
  </div>
  
   <br><br>   
  <div class="layui-form-item layui-form-text">
    <label class="layui-form-label">問題</label>
    <div class="layui-input-block">
      <textarea placeholder="请输入内容" class="layui-textarea" name="question" lay-verify="required" autocomplete="off"></textarea>
    </div>
  </div>  
  
  
  
  <div class="layui-form-item layui-form-text">
    <label class="layui-form-label">答案A</label>
    <div class="layui-input-block">
      <textarea placeholder="请输入内容" class="layui-textarea" name="answer1" lay-verify="required" autocomplete="off"></textarea>
    </div>
  </div>
  
 
  <div class="layui-form-item layui-form-text">
    <label class="layui-form-label">答案B</label>
    <div class="layui-input-block">
      <textarea placeholder="请输入内容" class="layui-textarea" name="answer2" lay-verify="required" autocomplete="off"></textarea>
    </div>
  </div>
 
  
  <div class="layui-form-item layui-form-text">
    <label class="layui-form-label">答案C</label>
    <div class="layui-input-block">
      <textarea placeholder="请输入内容" class="layui-textarea" name="answer3" lay-verify="required" autocomplete="off"></textarea>
    </div>
  </div>
 
   
  <div class="layui-form-item layui-form-text">
    <label class="layui-form-label">答案D</label>
    <div class="layui-input-block">
      <textarea placeholder="请输入内容" class="layui-textarea" name="answer4" lay-verify="required" autocomplete="off"></textarea>
    </div>
  </div>
 
<div class="layui-inline">
    <label class="layui-form-label">正確選項</label>
    <div class="layui-input-block">
      <select name="correct" lay-verify="required|line" id="team" autocomplete="off">
        <option value="A">A</option>
        <option value="B">B</option>
        <option value="C">C</option>
		<option value="D">D</option>
      </select>
    </div>
  </div>

 
 
 
 

 
 <br><br>
  <div class="layui-form-item">
    <div class="layui-input-block">
      <button class="layui-btn" lay-submit lay-filter="*">立即提交</button>
      <button type="reset" class="layui-btn layui-btn-primary">重置</button>
    </div>
  </div>
</form>
  </div>
</div>

<br><br><br>




<script>


layui.use(['form','jquery','layer'], function(){
  var form = layui.form;
  var $=layui.jquery;
  var layer=layui.layer;
  
  //自定义验证规则
  form.verify({
   
    stock: [/^\d+$/, '数量必须必须是数字']

  });
  
  //事件监听

  
 

  //监听提交
 form.on('submit(*)', function(data){
   var rasult = JSON.stringify(data.field);
    console.log(rasult);
	$.post("add.php",{name:rasult},
     function(data){
   // var obj = JSON.parse(data); 
     console.log(data);
	 layer.alert("保存成功",function(){ location.reload(); });	
    });
    return false;
  }); 
});



</script>

</div>
</body>
</html>
