            function initDowntimeCharts() {
                console.log("初始化停机率图表...");

                // --- 模拟数据生成 ---
                $.getJSON('../php/get_downtime_data.php', function(response) {
                if (response.status !== 'success') {
                    console.error('数据获取失败');
                    return;
                }

                const data = response.data;

                // 更新 KPI
                $('#dw-kpi-week').text(data.week.avg + '%');
                $('#dw-kpi-month').text(data.month.avg + '%');
                $('#dw-kpi-year').text(data.year.avg + '%');

                // 通用图表配置
                const commonConfig = {
                    chart: { backgroundColor: 'transparent' },
                    title: { text: null },
                    xAxis: { crosshair: true },
                    yAxis: { title: { text: null }, labels: { format: '{value}%' } },
                    tooltip: { pointFormat: '{point.y:.2f} %' },
                    credits: { enabled: false },
                    plotOptions: { series: { marker: { enabled: false } } }
                };

                // 渲染周图表
                Highcharts.chart('dw-chart-week', Highcharts.merge(commonConfig, {
                    chart: { type: 'areaspline' },
                    colors: ['#3498db'],
                    xAxis: { categories: data.week.labels },
                    series: [{ name: '停机率', data: data.week.values, fillOpacity: 0.3 }]
                }));

                // 渲染月图表
                Highcharts.chart('dw-chart-month', Highcharts.merge(commonConfig, {
                    chart: { type: 'line' },
                    colors: ['#2ecc71'],
                    xAxis: { categories: data.month.labels },
                    series: [{ name: '停机率', data: data.month.values }]
                }));

                // 渲染年图表
                Highcharts.chart('dw-chart-year', Highcharts.merge(commonConfig, {
                    chart: { type: 'column' },
                    colors: ['#9b59b6'],
                    xAxis: { categories: data.year.labels },
                    series: [{ name: '平均停机率', data: data.year.values }]
                }));
                
                });
            }
