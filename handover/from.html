<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>交接记录</title>
  <meta name="renderer" content="webkit">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="apple-mobile-web-app-status-bar-style" content="black"> 
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="format-detection" content="telephone=no">

  <link rel="stylesheet" href="../layui/css/layui.css" media="all">

</head>
<body class="layui-bg-gray">
<div class="layui-fluid" style="padding-top:15px;padding-bottom:15px">
<div class="layui-card">
  <div class="layui-card-header">TE maintain</div>
  <div class="layui-card-body">
<form class="layui-form layui-form-pane1" action="" lay-filter="first">
    <div class="layui-inline">
      <label class="layui-form-label">班別</label>
      <div class="layui-input-block">
        <select name="shift" lay-filter="shift"  lay-verify="required" autocomplete="off">
          <option value="">请选择班別</option>
          <option value="D">白班</option>
          <option value="N">夜班</option>
        </select>
      </div>
    </div>
	<br><br>
   
  <div class="layui-inline">
    <label class="layui-form-label">日期</label>
    <div class="layui-input-block">
      <input type="text" id="Adate" name="date" lay-verify="required|date"  placeholder="请输入日期" autocomplete="off" class="layui-input">
    </div>
  </div>
  <br><br>
  <div class="layui-form-item layui-form-text">
    <label class="layui-form-label">良率產出</label>
    <div class="layui-input-block">
      <textarea placeholder="请输入内容" class="layui-textarea" name="kpi" lay-verify="required" autocomplete="off"></textarea>
    </div>
  </div>
  
  <div class="layui-form-item layui-form-text">
    <label class="layui-form-label">其它事項</label>
    <div class="layui-input-block">
      <textarea placeholder="请输入内容" class="layui-textarea" name="other" lay-verify="required" autocomplete="off"></textarea>
    </div>
  </div>
 
   
  
  <div class="layui-form-item">
    <div class="layui-input-block">
      <button class="layui-btn" lay-submit lay-filter="*">立即提交</button>
      <button type="reset" class="layui-btn layui-btn-primary">重置</button>
    </div>
  </div>
</form>
  </div>
</div>

<br><br><br>


<script src="../layui/layui.js"></script>
<script src="/js/i18n.js"></script>

<script>

layui.use(['form','jquery','layer'], function(){
  var form = layui.form;
  var $=layui.jquery;
  var layer=layui.layer;
  
  //自定义验证规则
  form.verify({
   
    time: [/^\d+$/, '时间必须必须是数字']

  });
  
  //事件监听

  
 

  
   
  //监听提交
 form.on('submit(*)', function(data){
   var rasult = JSON.stringify(data.field);
   // console.log(rasult.time);
	 $.post("from.php",{name:rasult},
     function(data){
   // var obj = JSON.parse(data); 
     console.log(data);
	 layer.alert("保存成功",function(){ window.close(); });	
    });
    return false;
  }); 
});

layui.use('laydate', function(){
  var laydate = layui.laydate; 
  //执行一个laydate实例
  laydate.render({
    elem: '#Adate' //指定元素
	,theme: 'molv'
  });
});

</script>

</div>
</body>
</html>
