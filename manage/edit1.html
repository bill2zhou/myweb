<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>备品管理</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <link rel="stylesheet" href="../layui/css/layui.css" media="all">
    <script src="../layui/layui.js"></script>
    <script src="/js/i18n.js"></script>
</head>
<body class="layui-bg-gray">
<div class="layui-fluid" style="padding-top:15px;padding-bottom:15px">
  <div class="layui-card">
    <div class="layui-card-header">備品出庫</div>
    <div class="layui-card-body">
      <form class="layui-form" action="" lay-filter="first">

        <div class="layui-form-item">
          <label class="layui-form-label required">用户</label>
          <div class="layui-input-block">
            <input type="text" name="username" lay-verify="required" lay-reqtext="用户名不能为空" placeholder="请输入用户名" value="" class="layui-input">
            <div class="layui-form-mid layui-word-aux">填写自己姓名</div>
          </div>
        </div>

        <div class="layui-form-item">
          <label class="layui-form-label">型号</label>
          <div class="layui-input-block">
            <select name="model" lay-verify="required|line" id="xinhao" autocomplete="off">
              <option value="">型号</option>
              <option value="0.7N39">0.7N39</option>
              <option value="2NL38">2NL38</option>
              <option value="1N50">1N50</option>
              <option value="1N75">1N75</option>
              <option value="1N100">1N100</option>
              <option value="2N50">2N50</option>
              <option value="2N75">2N75</option>
              <option value="2N100">2N100</option>
            </select>
          </div>
        </div>

        <div class="layui-form-item">
          <label class="layui-form-label">數量</label>
          <div class="layui-input-block">
            <input type="text" name="quantily" lay-verify="count" placeholder="请输入數量" value="" class="layui-input">
            <div class="layui-form-mid layui-word-aux">數量必须是数字，單位盒</div>
          </div>
        </div>

        <div class="layui-form-item layui-form-text">
          <label class="layui-form-label">备注信息</label>
          <div class="layui-input-block">
            <textarea name="remark" class="layui-textarea" placeholder="请输入备注信息"></textarea>
          </div>
        </div>

        <div class="layui-form-item">
          <div class="layui-input-block">
            <button class="layui-btn layui-btn-normal" lay-submit lay-filter="saveBtn">确认</button>
          </div>
        </div>

      </form>
    </div>
  </div>
</div>
<script>
var query = location.search.substring(1);
var y = document.getElementById("xinhao");
y.selectedIndex = query;

layui.use(['form'], function () {
  var form = layui.form,
    layer = layui.layer,
    $ = layui.$;

  form.verify({
    count: [/^\d+$/, '數量必须是数字']
  });

  //监听提交
  form.on('submit(saveBtn)', function (data) {
    var rasult = JSON.stringify(data.field);
    console.log(rasult);
    $.post("../php/proben.php", { name: rasult },
      function () {
        layer.alert("保存成功", function () { window.close(); });
      });
    return false;
  });
});
</script>
</body>
</html>
