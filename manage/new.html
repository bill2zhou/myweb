<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>备品管理</title>
  <meta name="renderer" content="webkit">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="apple-mobile-web-app-status-bar-style" content="black"> 
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="format-detection" content="telephone=no">
  <link rel="stylesheet" href="../layui/css/layui.css" media="all">
<script src="../layui/layui.js"></script>
<script src="/js/i18n.js"></script>
</head>
<body class="layui-bg-gray">
<div class="layui-fluid" style="padding-top:15px;padding-bottom:15px">
<div class="layui-card">
  <div class="layui-card-header">TE Manage</div>
  <div class="layui-card-body">
<form class="layui-form layui-form-pane1" action="" lay-filter="first">

<div class="layui-inline">
    <label class="layui-form-label">部門</label>
    <div class="layui-input-block">
      <select name="team" lay-verify="required|line" id="team" autocomplete="off">
        <option value="">部門</option>
        <option value="AOI">AOI</option>
        <option value="ATE">ATE</option>
        <option value="FT">FT</option>
      </select>
    </div>
  </div>
  
  
  <br><br>
  <div class="layui-inline">
   <label class="layui-form-label">物品類別</label>
    <div class="layui-input-block">
      <select name="cate" lay-verify="required|line" id="cate" autocomplete="off">
      <option value="">物品類別:</option>
	  <option value="探針">探針</option>
      <option value="機臺備品">機臺備品</option>
      <option value="治具備品">治具備品</option>
      </select>
    </div>
  </div>
  
   <br><br>
   <div class="layui-inline">
    <label class="layui-form-label">物品</label>
    <div class="layui-input-block">
      <input type="text" name="thing"   lay-verify="required" placeholder="请输入物品類別" autocomplete="off" class="layui-input">
    </div>
  </div>
   
  <br><br>

  <div class="layui-inline">
    <label class="layui-form-label">编号</label>
    <div class="layui-input-block">
      <input type="text" name="barcode"   placeholder="请输入编号*非必填*" autocomplete="off" class="layui-input">
    </div>
  </div>
  
  <br><br>
   <div class="layui-inline">
    <label class="layui-form-label">型號</label>
    <div class="layui-input-block">
      <input type="text" name="model"   lay-verify="required" placeholder="请输入物品型號" autocomplete="off" class="layui-input">
    </div>
  </div>

   <br><br>
  
    <div class="layui-inline">
    <label class="layui-form-label">数量</label>
    <div class="layui-input-block">
      <input type="text" name="stock" lay-verify="required|stock"  placeholder="请输入数量" autocomplete="off" class="layui-input">
    </div>
  </div>
 <br><br>
 
 
     <div class="layui-inline">
    <label class="layui-form-label">安全庫存</label>
    <div class="layui-input-block">
      <input type="text" name="safestock" lay-verify="required|stock"  placeholder="请输入数量" autocomplete="off" class="layui-input">
    </div>
  </div>
 <br><br>
 
      <div class="layui-inline layui-form-text">
        <label class="layui-form-label">庫存説明</label>
        <div class="layui-input-block">
            <textarea name="tip" class="layui-textarea" placeholder="请输入數據説明信息"></textarea>
        </div>
    </div>
 
 
 

 
 <br><br>
  <div class="layui-form-item">
    <div class="layui-input-block">
      <button class="layui-btn" lay-submit lay-filter="*">立即提交</button>
      <button type="reset" class="layui-btn layui-btn-primary">重置</button>
    </div>
  </div>
</form>
  </div>
</div>

<br><br><br>




<script>


layui.use(['form','jquery','layer'], function(){
  var form = layui.form;
  var $=layui.jquery;
  var layer=layui.layer;
  
  //自定义验证规则
  form.verify({
   
    stock: [/^\d+$/, '数量必须必须是数字']

  });
  
  //事件监听

  
 

  //监听提交
 form.on('submit(*)', function(data){
   var rasult = JSON.stringify(data.field);
    console.log(rasult);
	$.post("stock.php",{name:rasult},
     function(data){
   // var obj = JSON.parse(data); 
     console.log(data);
	 layer.alert("保存成功",function(){ window.close(); });	
    });
    return false;
  }); 
});



</script>

</div>
</body>
</html>
