<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>备品管理</title>
  <meta name="renderer" content="webkit">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="apple-mobile-web-app-status-bar-style" content="black"> 
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="format-detection" content="telephone=no">
  <link rel="stylesheet" href="../layui/css/layui.css" media="all">
   <script src="../js/jquery-1.7.2.js"></script>  
   <script src="../layui/layui.js"></script>
   <script src="/js/i18n.js"></script>
</head>
<body class="layui-bg-gray">
<div class="layui-fluid" style="padding-top:15px;padding-bottom:15px">
<div class="layui-card">
  <div class="layui-card-header">TE Manage</div>
  <div class="layui-card-body">
<form class="layui-form layui-form-pane1" action="" lay-filter="first">

    <div class="layui-inline">
        <label class="layui-form-label required">用户</label>
        <div class="layui-input-block">
            <input type="text" name="username" lay-verify="required" lay-reqtext="用户名不能为空" placeholder="请输入用户名" value="" class="layui-input">
            <tip>填写自己姓名</tip>
        </div>
    </div>

  <br><br>	

   <div class="layui-inline">
        <label class="layui-form-label required">部門</label>
        <div class="layui-input-block">
            <input type="text" name="team" lay-verify="required" id="team" placeholder="部門" value="" class="layui-input">
        </div>
    </div>

  <br><br>	
	
	    <div class="layui-inline">
        <label class="layui-form-label required">物品類別</label>
        <div class="layui-input-block">
            <input type="text" name="cate" lay-verify="required" id="cate" placeholder="物品類別" value="" class="layui-input">
        </div>
    </div>

  <br><br>	
	
	
    <div class="layui-inline">
        <label class="layui-form-label required">物品</label>
        <div class="layui-input-block">
            <input type="text" name="thing" lay-verify="required" id="thing" placeholder="物品" value="" class="layui-input">
        </div>
    </div>

  <br><br>		
	
    <div class="layui-inline">
        <label class="layui-form-label required">型號</label>
        <div class="layui-input-block">
            <input type="text" name="model" lay-verify="required" id="model" placeholder="型號" value="" class="layui-input">
        </div>
    </div>

  <br><br>
 
  
    <div class="layui-inline">
    <label class="layui-form-label">数量</label>
    <div class="layui-input-block">
      <input type="text" name="stock" lay-verify="count" placeholder="请输入数量"  class="layui-input">
    </div>
  </div>
 <br><br>
 
     <div class="layui-inline layui-form-text">
        <label class="layui-form-label">备注信息</label>
        <div class="layui-input-block">
            <textarea name="remark" class="layui-textarea" placeholder="请输入备注信息"></textarea>
        </div>
    </div>
 
 <br><br>
  <div class="layui-form-item">
    <div class="layui-input-block">
      <button class="layui-btn" lay-submit lay-filter="*">立即提交</button>
      <button type="reset" class="layui-btn layui-btn-primary">重置</button>
    </div>
  </div>
</form>
  </div>
</div>

<br><br><br>




<script>


 var query = location.search.substring(1);
   var tm = document.getElementById("team");
   var th = document.getElementById("thing");
   var tc = document.getElementById("cate");
   var ty = document.getElementById("model");
// console.log(query);
 $.post("thing.php?q="+query,{},
     function(data){
	//  console.log(data);
    var obj = (typeof data === 'string' ? JSON.parse(data) : data); 
	//console.log(obj.team);
	tm.value=obj.team;
	th.value=obj.thing;	
	tc.value=obj.cate;
	ty.value=obj.type;	
	
    }
	);



layui.use(['form','jquery','layer'], function(){
  var form = layui.form;
  var $=layui.jquery;
  var layer=layui.layer;
  

  //自定义验证规则
  form.verify({
   
    count: [/^\d+$/, '數量必须是数字']

  });
  
  //事件监听

  
 

  //监听提交
 form.on('submit(*)', function(data){
   var rasult = JSON.stringify(data.field);
    console.log(rasult);
	$.post("add.php?q="+query,{name:rasult},
     function(data){
   // var obj = (typeof data === 'string' ? JSON.parse(data) : data); 
     console.log(data);
	 layer.alert("保存成功",function(){ window.close(); });	
    });
    return false;
  }); 
});



</script>

</div>
</body>
</html>
