<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>登陆</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta http-equiv="Access-Control-Allow-Origin" content="*">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="format-detection" content="telephone=no">
    <link rel="stylesheet" href="layui/css/layui.css" media="all">
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
</head>
<body>
<!-- 粒子背景层（particleground 会把 canvas 插入到该层内）
     注意：layui-bg-blue 会强制 color:#fff，必须放在背景层而不是 body 上，
     否则卡片内的 .layui-form-label / .layui-icon 继承成白色而在白底上不可见。 -->
<div id="pg-bg" class="layui-bg-blue" style="position:fixed;left:0;top:0;width:100%;height:100%;z-index:0"></div>

<div class="layui-container" style="position:relative;z-index:1">
  <div class="layui-row" style="padding-top:16vh">
    <div class="layui-col-md4 layui-col-md-offset4">
      <div class="layui-card">
        <div class="layui-card-header">用戶登录</div>
        <div class="layui-card-body">
          <form class="layui-form" action="">
            <div class="layui-form-item">
              <label class="layui-form-label">用户名</label>
              <div class="layui-input-block">
                <input type="text" name="username" lay-verify="required|account" placeholder="用户名或者邮箱" autocomplete="off" class="layui-input" value="ATE">
              </div>
            </div>
            <div class="layui-form-item">
              <label class="layui-form-label">密码</label>
              <div class="layui-input-block">
                <input type="password" name="password" lay-verify="required|password" placeholder="密码" autocomplete="off" class="layui-input" value="1234">
              </div>
            </div>
            <div class="layui-form-item">
              <label class="layui-form-label">验证码</label>
              <div class="layui-input-block">
                <div class="layui-input-inline" style="width:55%;margin-right:0">
                  <input type="text" name="captcha" lay-verify="required|captcha" placeholder="图形验证码" autocomplete="off" class="layui-input" value="xszg">
                </div>
                <div class="layui-input-inline" style="width:42%;margin-right:0">
                  <img id="captchaPic" src="images/captcha.jpg" alt="验证码" style="height:38px;width:100%;border:1px solid #e6e6e6">
                </div>
              </div>
            </div>
            <div class="layui-form-item">
              <div class="layui-input-block">
                <input type="checkbox" name="rememberMe" value="true" lay-skin="primary" title="记住密码">
              </div>
            </div>
            <div class="layui-form-item">
              <button class="layui-btn layui-btn-normal layui-btn-fluid" lay-submit lay-filter="login">登 入</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="lib/jquery-3.4.1/jquery-3.4.1.min.js" charset="utf-8"></script>
<script src="layui/layui.js" charset="utf-8"></script>
<script src="/js/i18n.js"></script>
<script src="lib/jq-module/jquery.particleground.min.js" charset="utf-8"></script>
<script>
layui.use(['form'], function () {
  var form = layui.form,
    layer = layui.layer;

  // 登录过期的时候，跳出 ifram 框架
  if (top.location != self.location) top.location = self.location;

  // 粒子线条背景
  $(document).ready(function () {
    $('#pg-bg').particleground({
      dotColor: '#7ec7fd',
      lineColor: '#7ec7fd'
    });
  });

  form.on('submit(login)', function (data) {
    data = data.field;
    if (data.username === '') {
      layer.msg('用户名不能为空');
      return false;
    }
    if (data.password === '') {
      layer.msg('密码不能为空');
      return false;
    }
    if (data.captcha === '') {
      layer.msg('验证码不能为空');
      return false;
    }

    // 发起异步请求获取 key，并在回调中验证密码
    $.post("php/getuser.php?q=" + data.username, {}, function (response) {
      var key = response.trim(); // 确保去除空格
      if (data.password !== key) {
        layer.msg('密码错误');
      } else {
        layer.msg('登录成功');
        window.location = 'main.html'; // 验证通过后跳转
      }
    });

    return false; // 阻止表单默认提交，等待异步结果
  });
});
</script>
</body>
</html>
